server:
  port: 2110
zuul:
  routes:
    module-user: /user/**
    module-main: /main/**
---
spring:
  profiles: server-online
  application:
    name: microservice-gateway-zuul
eureka:
  client:
    service-url:
      defaultZone: http://cy:123@134.175.157.42:2100/eureka/,http://cy:123@47.107.52.39:2100/eureka/
  instance:
    prefer-ip-address: true
---
spring:
  profiles: server-local
  application:
    name: microservice-gateway-zuul
eureka:
  client:
    service-url:
      # 如果在docker运行请修改localhost为eureka的docker服务名, docker中localhost无法被解析
      # defaultZone: http://cy:123@local-eureka:2100/eureka/
      defaultZone: http://cy:123@localhost:2100/eureka/
  instance:
    prefer-ip-address: true