version: "3"
services:

  # spring eureka 集群节点1
  peer1:
    image: tcyeee/microservice-discovery-eureka:0.0.1
    ports:
      - "2100:2100"
    environment:
      - spring.profiles.active=server-ali

  # spring eureka 集群节点2
  peer2:
    image: tcyeee/microservice-discovery-eureka:0.0.1
    ports:
      - "2100:2100"
    environment:
      - spring.profiles.active=server-tx

  # 网关
  microservice-gateway-zuul:
    image: tcyeee/microservice-gateway-zuul:0.0.1-SNAPSHOT
    ports:
      - "2110:2110"


