server:
  port: 1901  # 服务器访问端口

spring:
  datasource:
    url: ${url}?useUnicode=true&characterEncoding=UTF-8
    username: ${username}
    password: ${password}
    driver-class-name: ${driver}
  main:
    allow-bean-definition-overriding: true
  jpa:
    database: MYSQL
    show-sql: true                 # 是否显示后台处理的SQL语句
    hibernate.ddl-auto: update     # 自动检查实体和数据库表是否一致，如果不一致则会进行更新数据库表

# 调整日志级别
logging:
  level:
    root: warn